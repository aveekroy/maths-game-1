<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ayansh's Space Math Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        .crystal-glow { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
        .freeze-warning { animation: flash 1s infinite alternate; }
        @keyframes flash { from { opacity: 0.5; color: red; } to { opacity: 1; color: yellow; } }
    </style>
</head>
<body class="text-white font-sans">

    <!-- Game Container -->
    <div id="game-container" class="absolute inset-0"></div>

    <!-- UI Overlay -->
    <div class="absolute top-4 left-4 z-10">
        <h1 class="text-2xl font-bold text-cyan-400">Score: <span id="score">0</span></h1>
        <p id="hyperdrive-status" class="text-green-400 font-bold hidden text-xl mt-2">HYPERDRIVE ACTIVE!</p>
    </div>

    <!-- System Freeze Warning -->
    <div id="freeze-warning" class="absolute inset-0 flex flex-col items-center justify-center z-20 hidden bg-red-900 bg-opacity-40">
        <h1 class="text-6xl font-bold freeze-warning mb-4">SYSTEM FREEZE!</h1>
        <h2 class="text-3xl text-white">Wrong Answer (-1 Point)</h2>
        <p class="text-xl text-gray-200 mt-2">Thrusters locked for <span id="freeze-timer">10</span> seconds...</p>
    </div>

    <!-- Compact Dashboard -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 bg-opacity-80 p-4 rounded-xl border border-cyan-500 z-10 text-center shadow-lg w-11/12 max-w-md">
        <h2 class="text-sm text-gray-400 mb-1">TARGET COORDINATES</h2>
        <div id="question" class="text-3xl font-bold text-yellow-300 mb-3">Loading...</div>
        <div id="options" class="grid grid-cols-2 gap-2">
            <!-- Options injected here -->
        </div>
    </div>

    <!-- iPad Virtual Joystick -->
    <div id="virtual-joystick" class="absolute bottom-8 left-8 w-32 h-32 bg-slate-800 bg-opacity-60 rounded-full select-none z-50">
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-10 h-10 bg-cyan-500 rounded-full opacity-80 flex items-center justify-center text-white font-bold" 
             ontouchstart="simKey('w', true)" ontouchend="simKey('w', false)" onmousedown="simKey('w', true)" onmouseup="simKey('w', false)">W</div>
        <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-10 h-10 bg-cyan-500 rounded-full opacity-80 flex items-center justify-center text-white font-bold" 
             ontouchstart="simKey('s', true)" ontouchend="simKey('s', false)" onmousedown="simKey('s', true)" onmouseup="simKey('s', false)">S</div>
        <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-10 h-10 bg-cyan-500 rounded-full opacity-80 flex items-center justify-center text-white font-bold" 
             ontouchstart="simKey('a', true)" ontouchend="simKey('a', false)" onmousedown="simKey('a', true)" onmouseup="simKey('a', false)">A</div>
        <div class="absolute right-0 top-1/2 transform -translate-y-1/2 w-10 h-10 bg-cyan-500 rounded-full opacity-80 flex items-center justify-center text-white font-bold" 
             ontouchstart="simKey('d', true)" ontouchend="simKey('d', false)" onmousedown="simKey('d', true)" onmouseup="simKey('d', false)">D</div>
    </div>

    <script>
        // Key Simulator for iPad
        function simKey(key, isPressed) {
            if(event && event.type.includes('touch')) event.preventDefault();
            keys[key] = isPressed;
        }

        // Game State
        let score = 0;
        let correctAnswer = 0;
        let isHyperdrive = false;
        let isFrozen = false;
        let hyperdriveTimer = null;
        let freezeInterval = null;
        const keys = { w: false, a: false, s: false, d: false };

        // 3D Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000022, 0.002);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lighting (Brighter space)
        scene.add(new THREE.AmbientLight(0x404040, 2)); // Stronger ambient
        
        // Giant Suns
        const createSun = (color, x, y, z) => {
            const sunGeo = new THREE.SphereGeometry(20, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: color });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            sun.position.set(x, y, z);
            scene.add(sun);
            const light = new THREE.PointLight(color, 5, 300);
            light.position.set(x, y, z);
            scene.add(light);
        };
        createSun(0xffaa00, -100, 50, -200); // Orange Sun
        createSun(0x00aaff, 150, -50, -300); // Blue Sun

        // Asteroids & Crystals
        const asteroids = [];
        const crystals = [];
        const astGeo = new THREE.DodecahedronGeometry(5, 1);
        const astMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
        const cryGeo = new THREE.OctahedronGeometry(2);
        const cryMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });

        for (let i = 0; i < 200; i++) {
            // Standard Asteroids
            const asteroid = new THREE.Mesh(astGeo, astMat);
            asteroid.position.set((Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500);
            asteroid.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            scene.add(asteroid);
            asteroids.push(asteroid);

            // Hyper-Crystals (Fewer of them)
            if (i % 5 === 0) {
                const crystal = new THREE.Mesh(cryGeo, cryMat);
                crystal.position.set((Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500);
                scene.add(crystal);
                crystals.push(crystal);
            }
        }

        // Stars
        const starGeo = new THREE.BufferGeometry();
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
        const starVertices = [];
        for (let i = 0; i < 2000; i++) {
            starVertices.push((Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        scene.add(new THREE.Points(starGeo, starMat));

        // Math Logic (Max 20x10)
        function generateQuestion() {
            let num1 = Math.floor(Math.random() * 20) + 1;
            let num2 = Math.floor(Math.random() * 10) + 1;
            if (Math.random() > 0.5) [num1, num2] = [num2, num1]; // Swap randomly

            correctAnswer = num1 * num2;
            document.getElementById('question').innerText = `${num1} × ${num2} = ?`;
            
            let options = [correctAnswer];
            while (options.length < 4) {
                let wrong = correctAnswer + (Math.floor(Math.random() * 20) - 10);
                if (wrong > 0 && wrong !== correctAnswer && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "bg-cyan-700 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded border border-cyan-400";
                btn.innerText = `[${index + 1}]  ${opt}`;
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(answer) {
            if (isFrozen) return;

            if (answer === correctAnswer) {
                score++;
                document.getElementById('score').innerText = score;
                activateHyperdrive();
                generateQuestion();
            } else {
                score = Math.max(0, score - 1);
                document.getElementById('score').innerText = score;
                activateFreeze();
            }
        }

        // Penalty Logic
        function activateFreeze() {
            isFrozen = true;
            document.getElementById('freeze-warning').classList.remove('hidden');
            let timeLeft = 10;
            document.getElementById('freeze-timer').innerText = timeLeft;
            
            if (freezeInterval) clearInterval(freezeInterval);
            freezeInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('freeze-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(freezeInterval);
                    isFrozen = false;
                    document.getElementById('freeze-warning').classList.add('hidden');
                    generateQuestion();
                }
            }, 1000);
        }

        // Hyperdrive Logic
        function activateHyperdrive() {
            isHyperdrive = true;
            document.getElementById('hyperdrive-status').classList.remove('hidden');
            if (hyperdriveTimer) clearTimeout(hyperdriveTimer);
            hyperdriveTimer = setTimeout(() => {
                isHyperdrive = false;
                document.getElementById('hyperdrive-status').classList.add('hidden');
                camera.fov = 75;
                camera.updateProjectionMatrix();
            }, 5000);
        }

        // Keyboard Input bridging
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
            if (['1','2','3','4'].includes(e.key)) {
                const buttons = document.getElementById('options').getElementsByTagName('button');
                if (buttons[parseInt(e.key) - 1]) buttons[parseInt(e.key) - 1].click();
            }
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        // Animation & Flight Loop
        const direction = new THREE.Vector3();
        function animate() {
            requestAnimationFrame(animate);

            // Rotate objects
            crystals.forEach(c => c.rotation.y += 0.05);
            asteroids.forEach(a => a.rotation.x += 0.005);

            if (!isFrozen) {
                const speed = isHyperdrive ? 3.0 : 0.5;
                if (isHyperdrive) {
                    camera.fov = THREE.MathUtils.lerp(camera.fov, 100, 0.1);
                    camera.updateProjectionMatrix();
                }

                // Flight mechanics
                camera.getWorldDirection(direction);
                if (keys.w) camera.position.addScaledVector(direction, speed);
                if (keys.s) camera.position.addScaledVector(direction, -speed);
                
                // Simplified rotation for A/D turning
                if (keys.a) camera.rotation.y += 0.03;
                if (keys.d) camera.rotation.y -= 0.03;

                // Crystal Collision Detection
                if (isHyperdrive) {
                    crystals.forEach((crystal, index) => {
                        if (crystal.visible && camera.position.distanceTo(crystal.position) < 15) {
                            crystal.visible = false;
                            score++;
                            document.getElementById('score').innerText = score;
                            // Respawn crystal somewhere else
                            setTimeout(() => {
                                crystal.position.set(camera.position.x + (Math.random()-0.5)*200, camera.position.y + (Math.random()-0.5)*200, camera.position.z - 100);
                                crystal.visible = true;
                            }, 2000);
                        }
                    });
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        generateQuestion();
        animate();
    </script>
</body>
</html>
